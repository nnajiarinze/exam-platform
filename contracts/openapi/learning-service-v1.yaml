openapi: 3.1.0
info:
  title: Learning Service API
  version: 1.0.0
  description: Learner runtime API. The internal import operation requires service authentication.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
paths:
  /api/v1/me:
    get:
      operationId: getMyLearnerProfile
      summary: Load or create the authenticated learner profile
      tags: [Learner account]
      security: [{ learnerBearer: [] }]
      responses:
        "200": {description: Current learner profile,content: {application/json: {schema: {$ref: "#/components/schemas/LearnerProfile"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: updateMyLearnerProfile
      summary: Update the current learner profile
      tags: [Learner account]
      security: [{ learnerBearer: [] }]
      requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/UpdateLearnerProfile"}}}}
      responses:
        "200": {description: Updated learner profile,content: {application/json: {schema: {$ref: "#/components/schemas/LearnerProfile"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/Unprocessable"}
    delete:
      deprecated: true
      operationId: deleteMyLearnerAccount
      summary: Legacy deletion entry point; use the confirmed identity deletion flow
      tags: [Learner account]
      security: [{ learnerBearer: [] }]
      responses:
        "409": {$ref: "#/components/responses/Conflict"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/me/identity/methods:
    get:
      operationId: getMyLinkedLoginMethods
      tags: [Identity management]
      security: [{learnerBearer: []}]
      responses:
        "200": {description: Linked and available login methods without provider tokens,content: {application/json: {schema: {$ref: "#/components/schemas/LinkedLoginMethods"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/me/identity/links/{provider}:
    parameters:
      - {name: provider,in: path,required: true,schema: {type: string,enum: [google,apple]}}
    post:
      operationId: initiateMyIdentityProviderLink
      tags: [Identity management]
      security: [{learnerBearer: []}]
      responses:
        "200": {description: Keycloak application-initiated action to open with the existing PKCE client,content: {application/json: {schema: {$ref: "#/components/schemas/IdentityLinkInitiation"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/Unavailable"}
    delete:
      operationId: unlinkMyIdentityProvider
      tags: [Identity management]
      security: [{learnerBearer: []}]
      responses:
        "200": {description: Login methods after unlinking,content: {application/json: {schema: {$ref: "#/components/schemas/LinkedLoginMethods"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/me/identity/sessions/current/logout:
    post:
      operationId: logoutMyCurrentIdentitySession
      tags: [Identity management]
      security: [{learnerBearer: []}]
      responses:
        "204": {description: Current Keycloak session revoked}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/me/identity/sessions/logout-all:
    post:
      operationId: logoutAllMyIdentitySessions
      tags: [Identity management]
      security: [{learnerBearer: []}]
      responses:
        "204": {description: All Keycloak sessions revoked}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/me/identity/deletion:
    post:
      operationId: beginMyIdentityDeletion
      tags: [Identity management]
      security: [{learnerBearer: []}]
      responses:
        "200": {description: Time-bounded deletion confirmation request,content: {application/json: {schema: {$ref: "#/components/schemas/IdentityDeletionStatus"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/Unavailable"}
    get:
      operationId: getMyIdentityDeletionStatus
      tags: [Identity management]
      security: [{learnerBearer: []}]
      responses:
        "200": {description: Current deletion status,content: {application/json: {schema: {$ref: "#/components/schemas/IdentityDeletionStatus"}}}}
  /api/v1/me/identity/deletion/confirm:
    post:
      operationId: confirmMyIdentityDeletion
      tags: [Identity management]
      security: [{learnerBearer: []}]
      requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/ConfirmIdentityDeletion"}}}}
      responses:
        "200": {description: Completed identity deletion and learner anonymisation status,content: {application/json: {schema: {$ref: "#/components/schemas/IdentityDeletionStatus"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/me/identity/readiness:
    get:
      operationId: getMyIdentityManagementReadiness
      tags: [Identity management]
      security: [{learnerBearer: []}]
      responses:
        "200": {description: Non-secret identity-management readiness,content: {application/json: {schema: {$ref: "#/components/schemas/IdentityManagementReadiness"}}}}
  /api/v1/me/settings:
    get:
      operationId: getMyLearnerSettings
      summary: Retrieve goals, notification preferences, and current goal progress
      tags: [Learner settings]
      security: [{ learnerBearer: [] }]
      responses:
        "200": {description: Current learner settings,content: {application/json: {schema: {$ref: "#/components/schemas/LearnerSettings"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: updateMyLearnerSettings
      summary: Update the authenticated learner's settings using optimistic locking
      tags: [Learner settings]
      security: [{ learnerBearer: [] }]
      requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/UpdateLearnerSettings"}}}}
      responses:
        "200": {description: Updated learner settings,content: {application/json: {schema: {$ref: "#/components/schemas/LearnerSettings"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
  /api/v1/auth/readiness:
    get:
      operationId: getAuthenticationReadiness
      summary: Read non-secret production authentication capability health
      tags: [Identity management]
      security: []
      responses:
        "200": {description: Aggregate readiness without secrets or learner identifiers,content: {application/json: {schema: {$ref: "#/components/schemas/AuthenticationReadiness"}}}}
  /internal/v1/reports/learner-health:
    get:
      operationId: getInternalLearnerHealth
      summary: Aggregate learner runtime health for trusted operational reporting
      tags: [Internal reporting]
      security: [{internalApiKey: []}]
      responses:
        "200": {description: Aggregate counts and averages without learner PII,content: {application/json: {schema: {type: object,additionalProperties: true}}}}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": {description: Unexpected error,content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /api/v1/content/subjects:
    get:
      summary: List active subjects and topics
      operationId: getSubjects
      tags: [Content projection]
      security: [{ learnerBearer: [] }]
      parameters:
        - name: examId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', example: swedish-citizenship }
          description: Canonical lowercase kebab-case exam identifier. Legacy case and separator variants are normalized temporarily.
      responses:
        "200":
          description: Subjects and topics from the active learner-facing content release.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/learning/exams/{examId}/subjects:
    get:
      operationId: getStudySubjects
      summary: List subjects with lesson progress from the active content release
      tags: [Study]
      security: [{ learnerBearer: [] }]
      parameters:
        - {name: examId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      responses:
        "200": {description: Study subjects,content: {application/json: {schema: {type: array,items: {$ref: "#/components/schemas/StudySubject"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/learning/subjects/{subjectId}/topics:
    get:
      operationId: getStudyTopics
      summary: List learner-facing topics for a subject
      tags: [Study]
      security: [{ learnerBearer: [] }]
      parameters:
        - {name: subjectId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: examId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      responses:
        "200": {description: Study topics,content: {application/json: {schema: {type: array,items: {$ref: "#/components/schemas/StudyTopic"}}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/learning/topics/{topicId}/lesson:
    get:
      operationId: getTopicLesson
      summary: Get the published lesson and release-scoped learner progress
      tags: [Study]
      security: [{ learnerBearer: [] }]
      parameters:
        - {name: topicId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: examId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      responses:
        "200": {description: Topic lesson,content: {application/json: {schema: {$ref: "#/components/schemas/TopicLesson"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/learning/topics/{topicId}/progress:
    put:
      operationId: updateLessonProgress
      summary: Idempotently record the current or completed lesson section
      tags: [Study]
      security: [{ learnerBearer: [] }]
      parameters:
        - {name: topicId, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: examId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/LessonProgressUpdate"}}}}
      responses:
        "200": {description: Updated progress,content: {application/json: {schema: {$ref: "#/components/schemas/LessonProgress"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
  /api/v1/learning/continue:
    get:
      operationId: getContinueLearning
      summary: Get the learner's most recently accessed incomplete lesson
      tags: [Study]
      security: [{ learnerBearer: [] }]
      parameters:
        - {name: examId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      responses:
        "200":
          description: Continue item, or an empty body when no lesson is in progress
          content: {application/json: {schema: {oneOf: [{$ref: "#/components/schemas/ContinueLearning"}, {type: "null"}]}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /internal/v1/content-releases/import:
    description: The version segment is required; there is no `/internal/content-releases/import` alias.
    post:
      summary: Import a published content release
      operationId: importContentRelease
      tags: [Internal content projection]
      security: [{ internalApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./content-snapshot-v1.schema.json
      responses:
        "200":
          description: Imported or previously imported with the same checksum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentImportResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /internal/v1/content-releases/{externalReleaseId}/activate:
    post:
      summary: Explicitly activate an imported release for new learner sessions
      operationId: activateImportedContentRelease
      tags: [Internal content projection]
      security: [{ internalApiKey: [] }]
      parameters:
        - name: externalReleaseId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Activated or already active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentActivationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/practice-sessions:
    post:
      summary: Create a practice session
      operationId: createPracticeSession
      tags: [Practice]
      security: [{ learnerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePracticeSessionRequest" }
      responses:
        "200":
          description: Stable practice session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/practice-sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: Get a practice session
      operationId: getPracticeSession
      tags: [Practice]
      security: [{ learnerBearer: [] }]
      responses:
        "200":
          description: Session owned by the current learner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/practice-sessions/{sessionId}/next:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      summary: Get the next unanswered question
      operationId: getNextPracticeQuestion
      tags: [Practice]
      security: [{ learnerBearer: [] }]
      responses:
        "200":
          description: Next unanswered question. Correctness and explanation are intentionally absent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeQuestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/practice-sessions/{sessionId}/responses:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      summary: Submit one answer
      operationId: submitPracticeResponse
      tags: [Practice]
      security: [{ learnerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitAnswerRequest" }
      responses:
        "200":
          description: Accepted answer evaluation based on imported published content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/progress/topics:
    get:
      summary: List topic progress
      operationId: getTopicProgress
      tags: [Progress]
      security: [{ learnerBearer: [] }]
      responses:
        "200":
          description: Basic topic aggregates; not a readiness score.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TopicProgress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/mock-exams:
    post:
      summary: Start a mock examination from the active configured blueprint
      operationId: createMockExam
      tags: [Mock examinations]
      security: [{ learnerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMockExamRequest" }
      responses:
        "200":
          description: Fixed mock examination attempt created.
          content: { application/json: { schema: { $ref: "#/components/schemas/MockExamAttempt" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/mock-exams/history:
    get:
      summary: List finalized mock examination attempts
      operationId: getMockExamHistory
      tags: [Mock examinations]
      security: [{ learnerBearer: [] }]
      responses:
        "200":
          description: Finalized attempts in reverse chronological order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MockExamHistoryItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/mock-exams/configuration:
    get:
      summary: Get the active mock-exam configuration for an exam
      operationId: getMockExamConfiguration
      tags: [Mock examinations]
      security: [{ learnerBearer: [] }]
      parameters:
        - name: examId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Learner-visible exam instructions and thresholds.
          content: { application/json: { schema: { $ref: "#/components/schemas/MockExamConfiguration" } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/mock-exams/{attemptId}:
    parameters:
      - $ref: "#/components/parameters/AttemptId"
    get:
      summary: Get mock examination metadata and navigation state
      operationId: getMockExam
      tags: [Mock examinations]
      security: [{ learnerBearer: [] }]
      responses:
        "200":
          description: Learner-owned mock examination attempt.
          content: { application/json: { schema: { $ref: "#/components/schemas/MockExamAttempt" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/mock-exams/{attemptId}/next:
    parameters:
      - $ref: "#/components/parameters/AttemptId"
      - name: sequenceNumber
        in: query
        required: false
        description: Optional sequence to support previous, next, and jump navigation. Omit for next unanswered.
        schema: { type: integer, minimum: 1 }
    get:
      summary: Get a mock examination question
      operationId: getMockExamQuestion
      tags: [Mock examinations]
      security: [{ learnerBearer: [] }]
      responses:
        "200":
          description: Question without correctness or explanation.
          content: { application/json: { schema: { $ref: "#/components/schemas/MockExamQuestion" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/mock-exams/{attemptId}/responses:
    parameters:
      - $ref: "#/components/parameters/AttemptId"
    post:
      summary: Store or replace an answer before final submission
      operationId: submitMockExamResponse
      tags: [Mock examinations]
      security: [{ learnerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitMockExamAnswerRequest" }
      responses:
        "200":
          description: Updated attempt progress; correctness remains hidden.
          content: { application/json: { schema: { $ref: "#/components/schemas/MockExamProgress" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/mock-exams/{attemptId}/questions/{attemptQuestionId}/flag:
    parameters:
      - $ref: "#/components/parameters/AttemptId"
      - name: attemptQuestionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Set or clear a review flag
      operationId: flagMockExamQuestion
      tags: [Mock examinations]
      security: [{ learnerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlagMockExamQuestionRequest" }
      responses:
        "200":
          description: Updated attempt progress.
          content: { application/json: { schema: { $ref: "#/components/schemas/MockExamProgress" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/mock-exams/{attemptId}/submit:
    parameters:
      - $ref: "#/components/parameters/AttemptId"
    post:
      summary: Finalize and score a mock examination
      operationId: submitMockExam
      tags: [Mock examinations]
      security: [{ learnerBearer: [] }]
      responses:
        "200":
          description: Permanently stored score and detailed results.
          content: { application/json: { schema: { $ref: "#/components/schemas/MockExamResult" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/mock-exams/{attemptId}/results:
    parameters:
      - $ref: "#/components/parameters/AttemptId"
    get:
      summary: Get detailed results for a finalized mock examination
      operationId: getMockExamResults
      tags: [Mock examinations]
      security: [{ learnerBearer: [] }]
      responses:
        "200":
          description: Stored score, topic breakdown, and incorrect-question review.
          content: { application/json: { schema: { $ref: "#/components/schemas/MockExamResult" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/mock-exams/{attemptId}/results/questions:
    parameters:
      - $ref: "#/components/parameters/AttemptId"
    get:
      summary: Review all or only incorrect questions after submission
      operationId: getMockExamQuestionReview
      tags: [Mock examinations]
      security: [{ learnerBearer: [] }]
      parameters:
        - {name: incorrectOnly, in: query, required: false, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Immutable question review without internal identifiers.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/MockExamIncorrectQuestion"}}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    learnerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token with audience learning-api and LEARNER role.
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: Temporary service credential pending the production workload-identity adapter.
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Authentication is absent or invalid.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: The authenticated account is not allowed to perform this operation.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Learner-owned or requested resource was not found.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Request conflicts with current or previously accepted state.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unprocessable:
      description: Structurally valid request violates content or selection rules.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable:
      description: Protected identity-management integration is not configured or temporarily unavailable.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    LoginMethod:
      type: object
      additionalProperties: false
      required: [id,displayName,linked,available]
      properties:
        id: {type: string,enum: [password,google,apple]}
        displayName: {type: string}
        linked: {type: boolean}
        available: {type: boolean}
    LinkedLoginMethods:
      type: object
      additionalProperties: false
      required: [ready,methods,usableMethodCount]
      properties:
        ready: {type: boolean}
        methods: {type: array,items: {$ref: "#/components/schemas/LoginMethod"}}
        usableMethodCount: {type: integer,minimum: 0}
    IdentityLinkInitiation:
      type: object
      additionalProperties: false
      required: [provider,keycloakAction,correlationId]
      properties:
        provider: {type: string,enum: [google,apple]}
        keycloakAction: {type: string,pattern: '^idp_link:(google|apple)$'}
        correlationId: {type: string,format: uuid}
    ConfirmIdentityDeletion:
      type: object
      additionalProperties: false
      required: [requestId,confirmation]
      properties:
        requestId: {type: string,format: uuid}
        confirmation: {type: string,enum: [DELETE]}
    IdentityDeletionStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        requestId: {type: [string,"null"],format: uuid}
        status: {type: string,enum: [NOT_REQUESTED,PENDING_CONFIRMATION,PROCESSING,COMPLETED,FAILED]}
        requestedAt: {type: [string,"null"],format: date-time}
        expiresAt: {type: [string,"null"],format: date-time}
        completedAt: {type: [string,"null"],format: date-time}
        failureCode: {type: [string,"null"]}
    IdentityManagementReadiness:
      type: object
      additionalProperties: false
      required: [bffReady,googleEnabled,appleEnabled,linkingProtocol,finalMethodProtection,deletionEnabled]
      properties:
        bffReady: {type: boolean}
        googleEnabled: {type: boolean}
        appleEnabled: {type: boolean}
        linkingProtocol: {type: string,enum: [KEYCLOAK_AIA]}
        finalMethodProtection: {type: boolean}
        deletionEnabled: {type: boolean}
    AuthenticationProviderReadiness:
      type: object
      additionalProperties: false
      required: [alias,enabled,callback]
      properties:
        alias: {type: string,enum: [google,apple]}
        enabled: {type: boolean}
        callback: {type: string,format: uri}
        extensionVersion: {type: [string,"null"]}
        clientSecretExpiry: {type: [string,"null"]}
    AuthenticationEmailReadiness:
      type: object
      additionalProperties: false
      required: [enabled,verificationRequired,smtpConfigured]
      properties:
        enabled: {type: boolean}
        verificationRequired: {type: boolean}
        smtpConfigured: {type: boolean}
    AuthenticationReadiness:
      type: object
      additionalProperties: false
      required: [issuer,mobileCallback,bffReady,accountDeletionEnabled,email,providers,providerErrorCount24h,accountLinkingConflictCount24h,checkedAt]
      properties:
        issuer: {type: string,format: uri}
        mobileCallback: {type: string}
        bffReady: {type: boolean}
        accountDeletionEnabled: {type: boolean}
        email: {$ref: "#/components/schemas/AuthenticationEmailReadiness"}
        providers: {type: array,items: {$ref: "#/components/schemas/AuthenticationProviderReadiness"}}
        providerErrorCount24h: {type: integer,minimum: 0}
        accountLinkingConflictCount24h: {type: integer,minimum: 0}
        checkedAt: {type: string,format: date-time}
    LearnerProfile:
      type: object
      required: [id,emailVerified,displayName,interfaceLanguage,explanationLanguage,accountStatus,onboardingCompleted,createdAt,updatedAt]
      properties:
        id: {type: string,format: uuid}
        email: {type: [string,"null"],format: email}
        emailVerified: {type: boolean}
        displayName: {type: string}
        interfaceLanguage: {type: string}
        explanationLanguage: {type: string}
        accountStatus: {type: string,enum: [ACTIVE,DISABLED,DELETED]}
        onboardingCompleted: {type: boolean}
        createdAt: {type: string,format: date-time}
        updatedAt: {type: string,format: date-time}
        deletedAt: {type: [string,"null"],format: date-time}
    UpdateLearnerProfile:
      type: object
      required: [displayName,interfaceLanguage,explanationLanguage,onboardingCompleted]
      properties:
        displayName: {type: string,minLength: 1,maxLength: 200}
        interfaceLanguage: {type: string,minLength: 1,maxLength: 35}
        explanationLanguage: {type: string,minLength: 1,maxLength: 35}
        onboardingCompleted: {type: boolean}
    LearnerSettings:
      type: object
      required: [dailyQuestionGoal,weeklyStudyDaysGoal,studyReminderEnabled,preferredReminderTime,timezone,progressSummaryEnabled,achievementNotificationsEnabled,version,questionsAnsweredToday,studyDaysThisWeek,createdAt,updatedAt]
      properties:
        dailyQuestionGoal: {type: integer,minimum: 5,maximum: 100}
        weeklyStudyDaysGoal: {type: integer,minimum: 1,maximum: 7}
        studyReminderEnabled: {type: boolean}
        preferredReminderTime: {type: string,pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$',example: "19:00:00"}
        timezone: {type: string,minLength: 1,maxLength: 64,example: Europe/Stockholm}
        progressSummaryEnabled: {type: boolean}
        achievementNotificationsEnabled: {type: boolean}
        version: {type: integer,format: int64,minimum: 0}
        questionsAnsweredToday: {type: integer,minimum: 0}
        studyDaysThisWeek: {type: integer,minimum: 0,maximum: 7}
        createdAt: {type: string,format: date-time}
        updatedAt: {type: string,format: date-time}
    UpdateLearnerSettings:
      type: object
      required: [dailyQuestionGoal,weeklyStudyDaysGoal,studyReminderEnabled,preferredReminderTime,timezone,progressSummaryEnabled,achievementNotificationsEnabled,version]
      properties:
        dailyQuestionGoal: {type: integer,minimum: 5,maximum: 100}
        weeklyStudyDaysGoal: {type: integer,minimum: 1,maximum: 7}
        studyReminderEnabled: {type: boolean}
        preferredReminderTime: {type: string,pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$',example: "19:00:00"}
        timezone: {type: string,minLength: 1,maxLength: 64,example: Europe/Stockholm}
        progressSummaryEnabled: {type: boolean}
        achievementNotificationsEnabled: {type: boolean}
        version: {type: integer,format: int64,minimum: 0}
    Subject:
      type: object
      additionalProperties: false
      required: [id, name, topics]
      properties:
        id: { type: string, maxLength: 200 }
        name: { type: string, maxLength: 500 }
        topics:
          type: array
          items: { $ref: "#/components/schemas/Topic" }
    Topic:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, maxLength: 200 }
        name: { type: string, maxLength: 500 }
        description: { type: [string, "null"] }
    StudySubject:
      type: object
      additionalProperties: false
      required: [subjectId,title,topicCount,completedTopicCount]
      properties:
        subjectId: {type: string}
        title: {type: string}
        topicCount: {type: integer,minimum: 0}
        completedTopicCount: {type: integer,minimum: 0}
    StudyTopic:
      type: object
      additionalProperties: false
      required: [topicId,title,keyFactCount,readingTimeSeconds,relatedQuestionCount,completedSectionCount,completionPercentage,completed]
      properties:
        topicId: {type: string}
        title: {type: string}
        summary: {type: [string, "null"]}
        keyFactCount: {type: integer,minimum: 0}
        readingTimeSeconds: {type: integer,minimum: 0,description: "Calculated at 200 words per minute, with a 15-second minimum."}
        relatedQuestionCount: {type: integer,minimum: 0}
        completedSectionCount: {type: integer,minimum: 0}
        completionPercentage: {type: integer,minimum: 0,maximum: 100}
        completed: {type: boolean}
    LessonSourceLink:
      type: object
      additionalProperties: false
      required: [title,url]
      properties:
        title: {type: string}
        url: {type: string,format: uri}
    LessonSection:
      type: object
      additionalProperties: false
      required: [sectionId,title,explanation,displayOrder,sourceLinks]
      properties:
        sectionId: {type: string}
        title: {type: string}
        explanation: {type: string}
        displayOrder: {type: integer,minimum: 0}
        sourceLinks: {type: array,items: {$ref: "#/components/schemas/LessonSourceLink"}}
    LessonProgress:
      type: object
      additionalProperties: false
      required: [lastSectionId,completedSectionCount,totalSectionCount,completionPercentage,completed]
      properties:
        lastSectionId: {type: string}
        completedSectionCount: {type: integer,minimum: 0}
        totalSectionCount: {type: integer,minimum: 1}
        completionPercentage: {type: integer,minimum: 0,maximum: 100}
        completed: {type: boolean}
        startedAt: {type: [string, "null"],format: date-time}
        lastAccessedAt: {type: [string, "null"],format: date-time}
        completedAt: {type: [string, "null"],format: date-time}
    LessonProgressUpdate:
      type: object
      additionalProperties: false
      required: [sectionId,completed]
      properties:
        sectionId: {type: string,minLength: 1,maxLength: 200}
        completed: {type: boolean}
    TopicLesson:
      type: object
      additionalProperties: false
      required: [topicId,title,readingTimeSeconds,relatedQuestionCount,contentReleaseId,version,sections,progress]
      properties:
        topicId: {type: string}
        title: {type: string}
        summary: {type: [string, "null"]}
        readingTimeSeconds: {type: integer,minimum: 0}
        relatedQuestionCount: {type: integer,minimum: 0}
        contentReleaseId: {type: string}
        version: {type: string}
        sections: {type: array,minItems: 1,items: {$ref: "#/components/schemas/LessonSection"}}
        progress: {$ref: "#/components/schemas/LessonProgress"}
    ContinueLearning:
      type: object
      additionalProperties: false
      required: [topicId,topicTitle,subjectTitle,lastSectionId,completedSectionCount,totalSectionCount]
      properties:
        topicId: {type: string}
        topicTitle: {type: string}
        subjectTitle: {type: string}
        lastSectionId: {type: string}
        completedSectionCount: {type: integer,minimum: 0}
        totalSectionCount: {type: integer,minimum: 1}
    PracticeMode:
      type: string
      enum: [TOPIC, MIXED, INCORRECT_REVIEW]
      description: INCORRECT_REVIEW is reserved but not executable in v1.
    PracticeStatus:
      type: string
      enum: [ACTIVE, COMPLETED, ABANDONED]
    CreatePracticeSessionRequest:
      type: object
      additionalProperties: false
      required: [examId, mode, questionCount]
      properties:
        examId: { type: string, minLength: 1, maxLength: 200, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', example: swedish-citizenship, description: Canonical lowercase kebab-case exam identifier; legacy representations are normalized on input. }
        topicId: { type: [string, "null"], maxLength: 200 }
        mode: { $ref: "#/components/schemas/PracticeMode" }
        questionCount: { type: integer, minimum: 1, maximum: 50 }
    PracticeSession:
      type: object
      required: [sessionId, mode, status, answered, total]
      properties:
        sessionId: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/PracticeMode" }
        topicId: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/PracticeStatus" }
        answered: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        nextQuestion:
          oneOf:
            - $ref: "#/components/schemas/PracticeQuestion"
            - type: "null"
    PracticeQuestion:
      type: object
      additionalProperties: false
      required: [sessionQuestionId, questionId, prompt, questionType, answerOptions, selectedOptionIds, sequenceNumber, totalQuestionCount]
      properties:
        sessionQuestionId: { type: string, format: uuid }
        questionId: { type: string }
        prompt: { type: string }
        questionType: { type: string, enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, TRUE_FALSE] }
        answerOptions:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/AnswerOption" }
        selectedOptionIds:
          type: array
          items: { type: string }
        sequenceNumber: { type: integer, minimum: 1 }
        totalQuestionCount: { type: integer, minimum: 1 }
    AnswerOption:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id: { type: string }
        text: { type: string }
    SubmitAnswerRequest:
      type: object
      additionalProperties: false
      required: [sessionQuestionId, selectedOptionIds]
      properties:
        sessionQuestionId: { type: string, format: uuid }
        selectedOptionIds: { type: array, minItems: 1, maxItems: 6, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 200 } }
        responseTimeMillis: { type: [integer, "null"], format: int64, minimum: 0 }
    AnswerResult:
      type: object
      required: [correct, selectedOptionIds, correctOptionIds, explanation, optionFeedback, sessionProgress]
      properties:
        correct: { type: boolean }
        selectedOptionIds: { type: array, items: { type: string } }
        correctOptionIds: { type: array, items: { type: string } }
        explanation: { type: string }
        optionFeedback:
          type: array
          items:
            type: object
            required: [optionId, selected, correct]
            properties:
              optionId: { type: string }
              selected: { type: boolean }
              correct: { type: boolean }
              feedback: { type: [string, "null"] }
        sessionProgress:
          type: object
          required: [answered, total]
          properties:
            answered: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 1 }
    TopicProgress:
      type: object
      required: [topicId, questionsAnswered, correctAnswers, accuracyPercentage, lastPractisedAt]
      properties:
        topicId: { type: string }
        questionsAnswered: { type: integer, minimum: 0 }
        correctAnswers: { type: integer, minimum: 0 }
        accuracyPercentage: { type: number, minimum: 0, maximum: 100 }
        lastPractisedAt: { type: string, format: date-time }
    ContentImportResponse:
      type: object
      required: [releaseId, imported, status]
      properties:
        releaseId: { type: string, format: uuid }
        imported: { type: boolean }
        status: { type: string, enum: [IMPORTED, ACTIVE, RETIRED] }
    ContentActivationResponse:
      type: object
      required: [releaseId, activated, status]
      properties:
        releaseId: { type: string, format: uuid }
        activated: { type: boolean }
        status: { type: string, const: ACTIVE }
    CreateMockExamRequest:
      type: object
      additionalProperties: false
      required: [examId]
      properties:
        examId: { type: string, minLength: 1, maxLength: 200, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', example: swedish-citizenship, description: Canonical lowercase kebab-case exam identifier; legacy representations are normalized on input. }
    MockExamConfiguration:
      type: object
      additionalProperties: false
      required: [examId, name, description, questionCount, timed, passPercentage]
      properties:
        examId: { type: string }
        name: { type: string }
        description: { type: string }
        questionCount: { type: integer, minimum: 1 }
        durationMinutes: { type: [integer, "null"], minimum: 1, description: Null means untimed. }
        timed: { type: boolean }
        passPercentage: { type: number, minimum: 0, maximum: 100 }
    MockExamStatus:
      type: string
      enum: [ACTIVE, SUBMITTED, EXPIRED, ABANDONED]
    MockExamNavigationItem:
      type: object
      additionalProperties: false
      required: [attemptQuestionId, sequenceNumber, answered, flagged]
      properties:
        attemptQuestionId: { type: string, format: uuid }
        sequenceNumber: { type: integer, minimum: 1 }
        answered: { type: boolean }
        flagged: { type: boolean }
    MockExamAttempt:
      type: object
      additionalProperties: false
      required: [attemptId, examId, releaseId, name, description, status, startedAt, totalQuestions, timed, passPercentage, remainingSeconds, answered, questions]
      properties:
        attemptId: { type: string, format: uuid }
        examId: { type: string }
        releaseId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/MockExamStatus" }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        submittedAt: { type: [string, "null"], format: date-time }
        totalQuestions: { type: integer, minimum: 1 }
        durationMinutes: { type: [integer, "null"], minimum: 1 }
        timed: { type: boolean }
        passPercentage: { type: number, minimum: 0, maximum: 100 }
        remainingSeconds: { type: integer, minimum: 0 }
        answered: { type: integer, minimum: 0 }
        questions:
          type: array
          items: { $ref: "#/components/schemas/MockExamNavigationItem" }
    MockExamQuestion:
      type: object
      additionalProperties: false
      required: [attemptQuestionId, questionId, prompt, questionType, answerOptions, selectedOptionIds, sequenceNumber, totalQuestions, flagged, questionVersion, answerVersion, remainingSeconds]
      properties:
        attemptQuestionId: { type: string, format: uuid }
        questionId: { type: string }
        prompt: { type: string }
        questionType: { type: string, enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, TRUE_FALSE] }
        answerOptions:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/AnswerOption" }
        sequenceNumber: { type: integer, minimum: 1 }
        totalQuestions: { type: integer, minimum: 1 }
        selectedOptionIds: { type: array, items: { type: string } }
        flagged: { type: boolean }
        questionVersion: { type: integer, format: int64, minimum: 0 }
        answerVersion: { type: integer, format: int64, minimum: 0 }
        remainingSeconds: { type: integer, minimum: 0 }
    SubmitMockExamAnswerRequest:
      type: object
      additionalProperties: false
      required: [attemptQuestionId, selectedOptionIds]
      properties:
        attemptQuestionId: { type: string, format: uuid }
        selectedOptionIds: { type: array, minItems: 1, maxItems: 6, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 200 } }
        version: { type: integer, format: int64, minimum: 0, description: Optional optimistic-lock version; omitted for backwards compatibility. }
    FlagMockExamQuestionRequest:
      type: object
      additionalProperties: false
      required: [flagged]
      properties:
        flagged: { type: boolean }
        version: { type: integer, format: int64, minimum: 0, description: Optional optimistic-lock version; omitted for backwards compatibility. }
    MockExamProgress:
      type: object
      additionalProperties: false
      required: [answered, total, flagged, remainingSeconds]
      properties:
        answered: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        flagged: { type: integer, minimum: 0 }
        remainingSeconds: { type: integer, minimum: 0 }
    MockExamTopicResult:
      type: object
      additionalProperties: false
      required: [topicId, topicName, total, answered, correct, percentage]
      properties:
        topicId: { type: string }
        topicName: { type: string }
        total: { type: integer, minimum: 1 }
        answered: { type: integer, minimum: 0 }
        correct: { type: integer, minimum: 0 }
        percentage: { type: number, minimum: 0, maximum: 100 }
    MockExamObjectiveResult:
      type: object
      additionalProperties: false
      required: [objectiveId, objectiveName, total, answered, correct, percentage]
      properties:
        objectiveId: { type: string }
        objectiveName: { type: string }
        total: { type: integer, minimum: 1 }
        answered: { type: integer, minimum: 0 }
        correct: { type: integer, minimum: 0 }
        percentage: { type: number, minimum: 0, maximum: 100 }
    MockExamSubjectResult:
      type: object
      additionalProperties: false
      required: [subjectId, subjectName, total, correct, incorrect, unanswered, percentage]
      properties:
        subjectId: { type: string }
        subjectName: { type: string }
        total: { type: integer, minimum: 1 }
        correct: { type: integer, minimum: 0 }
        incorrect: { type: integer, minimum: 0, description: Questions answered with an incorrect option set; excludes unanswered questions. }
        unanswered: { type: integer, minimum: 0, description: Questions for which no answer was submitted. }
        percentage: { type: number, minimum: 0, maximum: 100 }
    MockExamIncorrectQuestion:
      type: object
      additionalProperties: false
      required: [questionId, prompt, questionType, selectedOptionIds, correctOptionIds, options, explanation, topicName, objectiveName, lessonTopicId]
      properties:
        questionId: { type: string }
        prompt: { type: string }
        questionType: { type: string, enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, TRUE_FALSE] }
        selectedOptionIds: { type: array, items: { type: string } }
        correctOptionIds: { type: array, items: { type: string } }
        options:
          type: array
          items:
            type: object
            required: [id, text, selected, correct, missed]
            properties:
              id: { type: string }
              text: { type: string }
              selected: { type: boolean }
              correct: { type: boolean }
              missed: { type: boolean }
              feedback: { type: [string, "null"] }
        explanation: { type: string }
        topicName: { type: string }
        objectiveName: { type: string }
        lessonTopicId: { type: string }
    MockExamResult:
      type: object
      additionalProperties: false
      required: [attemptId, name, status, startedAt, completedAt, durationSeconds, correctAnswers, incorrectAnswers, unansweredAnswers, percentage, passPercentage, passed, autoSubmitted, subjects, topics, objectives, incorrectQuestions]
      properties:
        attemptId: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: "#/components/schemas/MockExamStatus" }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        durationSeconds: { type: integer, minimum: 0 }
        correctAnswers: { type: integer, minimum: 0 }
        incorrectAnswers: { type: integer, minimum: 0, description: Questions answered with an incorrect option set; excludes unanswered questions. }
        unansweredAnswers: { type: integer, minimum: 0, description: Questions for which no answer was submitted. }
        percentage: { type: number, minimum: 0, maximum: 100 }
        passPercentage: { type: number, minimum: 0, maximum: 100 }
        passed: { type: boolean }
        autoSubmitted: { type: boolean }
        subjects:
          type: array
          items: { $ref: "#/components/schemas/MockExamSubjectResult" }
        topics:
          type: array
          items: { $ref: "#/components/schemas/MockExamTopicResult" }
        objectives:
          type: array
          items: { $ref: "#/components/schemas/MockExamObjectiveResult" }
        incorrectQuestions:
          type: array
          items: { $ref: "#/components/schemas/MockExamIncorrectQuestion" }
    MockExamHistoryItem:
      type: object
      additionalProperties: false
      required: [attemptId, name, status, startedAt, durationSeconds, score, percentage, passed, totalQuestions]
      properties:
        attemptId: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: "#/components/schemas/MockExamStatus" }
        startedAt: { type: string, format: date-time }
        durationSeconds: { type: integer, minimum: 0 }
        score: { type: integer, minimum: 0 }
        percentage: { type: number, minimum: 0, maximum: 100 }
        passed: { type: boolean }
        totalQuestions: { type: integer, minimum: 1 }
    Error:
      type: object
      required: [code, message, timestamp, errors]
      properties:
        code: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
