services:
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  identity-provider:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-keycloak-admin
      KC_HOSTNAME: ${OIDC_PUBLIC_BASE_URL:-http://localhost:8090}
      KC_HTTP_ENABLED: "true"
    ports:
      - "8090:8080"
    volumes:
      - ./infrastructure/keycloak/exam-platform-realm.json:/opt/keycloak/data/import/exam-platform-realm.json:ro
    depends_on:
      mailpit:
        condition: service_started

  content-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: content
      POSTGRES_USER: content
      POSTGRES_PASSWORD: content
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - content-database-data:/var/lib/postgresql/data

  content-service:
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
    environment:
      CONTENT_DATABASE_URL: jdbc:postgresql://content-database:5432/content
      CONTENT_DATABASE_USERNAME: content
      CONTENT_DATABASE_PASSWORD: content
      CONTENT_DEV_IDENTITY_ENABLED: "true"
      LEARNING_SERVICE_BASE_URL: http://learning-service:8080
      LEARNING_INTERNAL_API_KEY: ${LEARNING_INTERNAL_API_KEY:-local-development-only}
      OIDC_ISSUER_URI: ${OIDC_PUBLIC_BASE_URL:-http://localhost:8090}/realms/exam-platform
      OIDC_JWK_SET_URI: http://identity-provider:8080/realms/exam-platform/protocol/openid-connect/certs
      CONTENT_OIDC_AUDIENCE: content-api
      AI_SERVICE_BASE_URL: http://ai-service:8080
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:-local-ai-development-only}
      AI_CORPUS_COMPLETION_ENABLED: ${AI_CORPUS_COMPLETION_ENABLED:-false}
      AI_CORPUS_COMPLETION_ALLOWED_CORPUS: ${AI_CORPUS_COMPLETION_ALLOWED_CORPUS:-}
      AI_CORPUS_COMPLETION_ALLOWED_ACTOR: ${AI_CORPUS_COMPLETION_ALLOWED_ACTOR:-corpus-automation}
      AI_CORPUS_COMPLETION_MAX_JOBS_PER_HOUR: ${AI_CORPUS_COMPLETION_MAX_JOBS_PER_HOUR:-200}
    ports:
      - "8082:8080"
    depends_on:
      content-database:
        condition: service_healthy
      learning-service:
        condition: service_started
      identity-provider:
        condition: service_started
      ai-service:
        condition: service_started

  ai-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - ai-database-data:/var/lib/postgresql/data

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    environment:
      AI_DATABASE_URL: jdbc:postgresql://ai-database:5432/ai
      AI_DATABASE_USERNAME: ai
      AI_DATABASE_PASSWORD: ai
      AI_EDITORIAL_ASSISTANT_ENABLED: "true"
      AI_PROVIDER: ${AI_PROVIDER:-FAKE}
      AI_BILLING_POLICY: FREE_ONLY
      AI_ALLOW_PAID_FALLBACK: "false"
      AI_REQUIRE_ZERO_COST_PROVIDER: "true"
      AI_ALLOW_AUTOMATIC_BILLING_UPGRADE: "false"
      AI_PROVIDER_PRIORITY: ${AI_PROVIDER_PRIORITY:-GEMINI,GROQ,OPENROUTER_FREE,OPENROUTER_PAID}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-true}
      GEMINI_FREE_ONLY: "true"
      AI_MODEL: ${AI_MODEL:-deterministic-v1}
      AI_GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-}
      AI_GEMINI_MODEL: ${AI_GEMINI_MODEL:-gemini-3.1-flash-lite}
      AI_USAGE_MODE: ${AI_USAGE_MODE:-FREE_ONLY}
      AI_GEMINI_EXPECTED_BILLING_TIER: ${AI_GEMINI_EXPECTED_BILLING_TIER:-}
      AI_GEMINI_PROJECT_LABEL: ${AI_GEMINI_PROJECT_LABEL:-}
      AI_GEMINI_INTERNAL_RPM_LIMIT: ${AI_GEMINI_INTERNAL_RPM_LIMIT:-0}
      AI_GEMINI_INTERNAL_TPM_LIMIT: ${AI_GEMINI_INTERNAL_TPM_LIMIT:-0}
      AI_GEMINI_INTERNAL_RPD_LIMIT: ${AI_GEMINI_INTERNAL_RPD_LIMIT:-0}
      AI_PAID_USAGE_ENABLED: ${AI_PAID_USAGE_ENABLED:-false}
      AI_MONTHLY_SPEND_LIMIT_USD: ${AI_MONTHLY_SPEND_LIMIT_USD:-0}
      GROQ_ENABLED: ${GROQ_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GROQ_FREE_ONLY: "true"
      GROQ_FREE_REQUEST_LIMIT: ${GROQ_FREE_REQUEST_LIMIT:-0}
      GROQ_FREE_TOKEN_LIMIT: ${GROQ_FREE_TOKEN_LIMIT:-0}
      CLOUDFLARE_WORKERS_AI_ENABLED: ${CLOUDFLARE_WORKERS_AI_ENABLED:-false}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_WORKERS_AI_API_TOKEN: ${CLOUDFLARE_WORKERS_AI_API_TOKEN:-}
      CLOUDFLARE_WORKERS_AI_MODEL: ${CLOUDFLARE_WORKERS_AI_MODEL:-}
      CLOUDFLARE_WORKERS_AI_FREE_ONLY: "true"
      CLOUDFLARE_DAILY_NEURON_LIMIT: ${CLOUDFLARE_DAILY_NEURON_LIMIT:-10000}
      OPENROUTER_ENABLED: ${OPENROUTER_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_ALLOW_FREE_ROUTER: ${OPENROUTER_ALLOW_FREE_ROUTER:-false}
      OPENROUTER_FREE_ONLY: "true"
      OPENROUTER_ALLOW_PAID: ${OPENROUTER_ALLOW_PAID:-false}
      OPENROUTER_BUDGET_USD: ${OPENROUTER_BUDGET_USD:-0}
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:-local-ai-development-only}
    ports:
      - "8083:8080"
    depends_on:
      ai-database:
        condition: service_healthy

  learning-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learning
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: learning
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning -d learning"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - learning-database-data:/var/lib/postgresql/data

  learning-service:
    build:
      context: .
      dockerfile: services/learning-service/Dockerfile
    environment:
      LEARNING_DATABASE_URL: jdbc:postgresql://learning-database:5432/learning
      LEARNING_DATABASE_USERNAME: learning
      LEARNING_DATABASE_PASSWORD: learning
      LEARNING_DEV_IDENTITY_ENABLED: "true"
      LEARNING_INTERNAL_API_KEY: ${LEARNING_INTERNAL_API_KEY:-local-development-only}
      OIDC_ISSUER_URI: ${OIDC_PUBLIC_BASE_URL:-http://localhost:8090}/realms/exam-platform
      OIDC_JWK_SET_URI: http://identity-provider:8080/realms/exam-platform/protocol/openid-connect/certs
      LEARNING_OIDC_AUDIENCE: learning-api
    ports:
      - "8080:8080"
    depends_on:
      learning-database:
        condition: service_healthy
      identity-provider:
        condition: service_started

volumes:
  content-database-data:
  learning-database-data:
  ai-database-data:
