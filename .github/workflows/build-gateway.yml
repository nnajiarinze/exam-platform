name: Build immutable hosted gateway

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full tested commit SHA to build
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable input
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: '[[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/citizenship-api-gateway:${{ inputs.commit_sha }}
          cache-from: type=gha,scope=citizenship-api-gateway
          cache-to: type=gha,mode=max,scope=citizenship-api-gateway
