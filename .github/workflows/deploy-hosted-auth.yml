name: Deploy hosted authentication experience

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full tested commit SHA with published auth images
        required: true
      public_domain:
        description: Authoritative hosted HTTPS hostname
        required: true
        default: api.tinkona.com

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hosted
    steps:
      - name: Validate immutable inputs
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PUBLIC_DOMAIN: ${{ inputs.public_domain }}
        run: |
          [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PUBLIC_DOMAIN}" == api.tinkona.com ]]
      - name: Configure protected Hetzner SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTED_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTED_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" >~/.ssh/id_ed25519
          printf '%s\n' "${KNOWN_HOSTS}" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy only gateway, identity provider, and identity readiness backend
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PUBLIC_DOMAIN: ${{ inputs.public_domain }}
          HOSTED_HOST: ${{ secrets.HOSTED_HOST }}
          HOSTED_USER: ${{ secrets.HOSTED_USER }}
          KEYCLOAK_GOOGLE_CLIENT_ID: ${{ secrets.KEYCLOAK_GOOGLE_CLIENT_ID }}
          KEYCLOAK_GOOGLE_CLIENT_SECRET: ${{ secrets.KEYCLOAK_GOOGLE_CLIENT_SECRET }}
          KEYCLOAK_GOOGLE_ENABLED: ${{ vars.KEYCLOAK_GOOGLE_ENABLED != '' && vars.KEYCLOAK_GOOGLE_ENABLED || secrets.KEYCLOAK_GOOGLE_ENABLED }}
        run: |
          ssh -o BatchMode=yes "${HOSTED_USER}@${HOSTED_HOST}" "KEYCLOAK_GOOGLE_CLIENT_ID='${KEYCLOAK_GOOGLE_CLIENT_ID}' KEYCLOAK_GOOGLE_CLIENT_SECRET='${KEYCLOAK_GOOGLE_CLIENT_SECRET}' KEYCLOAK_GOOGLE_ENABLED='${KEYCLOAK_GOOGLE_ENABLED}' bash -s '${COMMIT_SHA}' '${PUBLIC_DOMAIN}'" <<'REMOTE'
          set -Eeuo pipefail
          commit_sha="$1" public_domain="$2"
          root=/opt/citizenship-platform
          repo="${root}/repo"
          env_file="${root}/.env"
          release_env="${root}/.release.env"
          [[ -f "${env_file}" && "$(stat -c '%a' "${env_file}")" == 600 ]]
          grep -q '^RESEND_API_KEY=.' "${env_file}" || { echo 'Protected RESEND_API_KEY is not provisioned' >&2; exit 1; }
          cd "${repo}"
          git fetch --quiet origin "${commit_sha}"
          git checkout --detach "${commit_sha}"
          compose=(docker compose --env-file "${env_file}" --env-file "${release_env}" -f docker-compose.hosted.yml)
          backup="$(mktemp "${release_env}.XXXXXX")"
          cp "${release_env}" "${backup}"
          update_release_env() {
            local key="$1" value="$2" temporary
            temporary="$(mktemp "${release_env}.XXXXXX")"
            awk -F= -v key="${key}" -v value="${value}" '
              BEGIN { replaced=0 }
              $1==key { if (!replaced) print key "=" value; replaced=1; next }
              { print }
              END { if (!replaced) print key "=" value }
            ' "${release_env}" >"${temporary}"
            chmod 600 "${temporary}"
            mv "${temporary}" "${release_env}"
          }
          rollback() {
            cp "${backup}" "${release_env}"
            "${compose[@]}" up -d --no-deps api-gateway learning-service keycloak >/dev/null 2>&1 || true
          }
          trap rollback ERR
          update_release_env GATEWAY_IMAGE_TAG "${commit_sha}"
          update_release_env KEYCLOAK_IMAGE_TAG "${commit_sha}"
          update_release_env LEARNING_IMAGE_TAG "${commit_sha}"
          update_release_env KEYCLOAK_SMTP_HOST smtp.resend.com
          update_release_env KEYCLOAK_SMTP_PORT 587
          update_release_env KEYCLOAK_SMTP_USERNAME resend
          update_release_env KEYCLOAK_SMTP_FROM no-reply@tinkona.com
          update_release_env KEYCLOAK_SMTP_FROM_DISPLAY_NAME 'Svea Study'
          update_release_env KEYCLOAK_SMTP_REPLY_TO support@tinkona.com
          update_release_env KEYCLOAK_SMTP_REPLY_TO_DISPLAY_NAME 'Svea Study Support'
          update_release_env KEYCLOAK_SMTP_STARTTLS true
          update_release_env KEYCLOAK_SMTP_SSL false
          update_release_env KEYCLOAK_SMTP_CONFIGURED true
          update_release_env KEYCLOAK_EMAIL_DMARC_STATUS present
          update_env() {
            local key="$1" value="$2" temporary
            temporary="$(mktemp "${env_file}.XXXXXX")"
            awk -F= -v key="${key}" -v value="${value}" '
              BEGIN { replaced=0 }
              $1==key { if (!replaced) print key "=" value; replaced=1; next }
              { print }
              END { if (!replaced) print key "=" value }
            ' "${env_file}" >"${temporary}"
            chmod 600 "${temporary}"
            mv "${temporary}" "${env_file}"
          }
          [[ -n "${KEYCLOAK_GOOGLE_CLIENT_ID:-}" ]] || { echo 'Protected KEYCLOAK_GOOGLE_CLIENT_ID is not provisioned' >&2; exit 1; }
          [[ -n "${KEYCLOAK_GOOGLE_CLIENT_SECRET:-}" ]] || { echo 'Protected KEYCLOAK_GOOGLE_CLIENT_SECRET is not provisioned' >&2; exit 1; }
          [[ "${KEYCLOAK_GOOGLE_ENABLED:-}" == true ]] || { echo 'KEYCLOAK_GOOGLE_ENABLED must be true in hosted vars/secrets' >&2; exit 1; }
          update_env KEYCLOAK_GOOGLE_CLIENT_ID "${KEYCLOAK_GOOGLE_CLIENT_ID}"
          update_env KEYCLOAK_GOOGLE_CLIENT_SECRET "${KEYCLOAK_GOOGLE_CLIENT_SECRET}"
          update_env KEYCLOAK_GOOGLE_ENABLED "${KEYCLOAK_GOOGLE_ENABLED}"
          "${compose[@]}" pull api-gateway learning-service keycloak
          "${compose[@]}" up -d --no-deps --wait --wait-timeout 120 keycloak
          KEYCLOAK_SECURITY_MODE=HTTPS_HOSTED ADMIN_PORTAL_URL="https://${public_domain}" \
            KEYCLOAK_SMTP_HOST=smtp.resend.com KEYCLOAK_SMTP_PORT=587 KEYCLOAK_SMTP_USERNAME=resend \
            KEYCLOAK_SMTP_FROM=no-reply@tinkona.com KEYCLOAK_SMTP_FROM_DISPLAY_NAME='Svea Study' \
            KEYCLOAK_SMTP_REPLY_TO=support@tinkona.com KEYCLOAK_SMTP_REPLY_TO_DISPLAY_NAME='Svea Study Support' \
            KEYCLOAK_SMTP_STARTTLS=true KEYCLOAK_SMTP_SSL=false KEYCLOAK_EMAIL_DMARC_STATUS=present \
            ./infrastructure/hetzner/harden-keycloak.sh
          "${compose[@]}" up -d --no-deps --wait --wait-timeout 120 learning-service
          "${compose[@]}" up -d --no-deps --wait --wait-timeout 60 api-gateway
          "${compose[@]}" exec -T --user 101:101 api-gateway nginx -t
          API_DOMAIN="${public_domain}" ./infrastructure/hetzner/smoke-test.sh --internal
          gateway_image="$("${compose[@]}" ps -q api-gateway | xargs docker inspect -f '{{.Config.Image}}')"
          keycloak_image="$("${compose[@]}" ps -q keycloak | xargs docker inspect -f '{{.Config.Image}}')"
          learning_image="$("${compose[@]}" ps -q learning-service | xargs docker inspect -f '{{.Config.Image}}')"
          [[ "${gateway_image}" == */citizenship-api-gateway:"${commit_sha}" ]]
          [[ "${keycloak_image}" == */citizenship-keycloak:"${commit_sha}" ]]
          [[ "${learning_image}" == */citizenship-learning-service:"${commit_sha}" ]]
          trap - ERR
          rm -f "${backup}"
          REMOTE
      - name: Verify public authentication surface
        env:
          PUBLIC_DOMAIN: ${{ inputs.public_domain }}
        run: |
          set -Eeuo pipefail
          base="https://${PUBLIC_DOMAIN}"
          issuer="${base}/auth/realms/exam-platform"
          curl --fail --silent --show-error "${issuer}/.well-known/openid-configuration" >discovery.json
          jq -e --arg issuer "${issuer}" '.issuer==$issuer and (.authorization_endpoint|startswith($issuer+"/"))' discovery.json
          curl --fail --silent --show-error --get --output login.html \
            --data-urlencode client_id=mobile-app \
            --data-urlencode redirect_uri=sveastudy://auth/callback \
            --data-urlencode response_type=code \
            --data-urlencode scope='openid profile email' \
            --data-urlencode code_challenge=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --data-urlencode code_challenge_method=S256 \
            --data-urlencode ui_locales=sv \
            "$(jq -r .authorization_endpoint discovery.json)"
          grep -q '<title>Logga in till Svea Study</title>' login.html
          curl --fail --silent --show-error "${base}/healthz" >/dev/null
