name: Repair hosted OIDC reachability

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full tested operations commit SHA
        required: true
      image_sha:
        description: Full implementation SHA with published immutable images
        required: true
      public_domain:
        description: Public HTTPS hostname resolving to the authoritative Hetzner host
        required: true
        default: api.46-224-221-7.sslip.io

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: hosted
    steps:
      - name: Validate immutable inputs
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          IMAGE_SHA: ${{ inputs.image_sha }}
          PUBLIC_DOMAIN: ${{ inputs.public_domain }}
        run: |
          [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${IMAGE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PUBLIC_DOMAIN}" == api.46-224-221-7.sslip.io ]]
          [[ "$(getent ahostsv4 "${PUBLIC_DOMAIN}" | awk 'NR==1{print $1}')" == 46.224.221.7 ]]
      - name: Configure protected Hetzner SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTED_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTED_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" >~/.ssh/id_ed25519
          printf '%s\n' "${KNOWN_HOSTS}" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Provision TLS and deploy affected components
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          IMAGE_SHA: ${{ inputs.image_sha }}
          PUBLIC_DOMAIN: ${{ inputs.public_domain }}
          HOSTED_HOST: ${{ secrets.HOSTED_HOST }}
          HOSTED_USER: ${{ secrets.HOSTED_USER }}
        run: |
          ssh -o BatchMode=yes "${HOSTED_USER}@${HOSTED_HOST}" "bash -s '${COMMIT_SHA}' '${IMAGE_SHA}' '${PUBLIC_DOMAIN}'" <<'REMOTE'
          set -Eeuo pipefail
          commit_sha="$1" image_sha="$2" public_domain="$3"
          root=/opt/citizenship-platform
          repo="${root}/repo"
          env_file="${root}/.env"
          [[ -f "${env_file}" && "$(stat -c '%a' "${env_file}")" == 600 ]]
          cd "${repo}"
          git fetch --quiet origin "${commit_sha}"
          git checkout --detach "${commit_sha}"
          tls_email="$(sed -n 's/^TLS_EMAIL=//p' "${env_file}" | tail -1)"
          release_env="${root}/.release.env"
          compose=(docker compose --env-file "${env_file}" --env-file "${release_env}" -f docker-compose.hosted.yml)
          gateway_stopped=false
          recover_gateway() {
            if [[ "${gateway_stopped}" == true ]]; then "${compose[@]}" up -d api-gateway >/dev/null 2>&1 || true; fi
          }
          trap recover_gateway EXIT
          if ! docker run --rm -v /etc/letsencrypt:/certs:ro alpine:3.22 \
            sh -c "test -s '/certs/live/${public_domain}/fullchain.pem' && test -s '/certs/live/${public_domain}/privkey.pem'"; then
            "${compose[@]}" stop api-gateway
            gateway_stopped=true
            API_DOMAIN="${public_domain}" TLS_EMAIL="${tls_email}" TLS_AUTHENTICATOR=standalone \
              ./infrastructure/hetzner/provision-tls.sh
          else
            echo "Using the existing certificate for ${public_domain}."
          fi
          update_env() {
            local key="$1" value="$2" temporary
            temporary="$(mktemp "${env_file}.XXXXXX")"
            awk -F= -v key="${key}" -v value="${value}" '
              BEGIN { replaced=0 }
              $1==key { if (!replaced) print key "=" value; replaced=1; next }
              { print }
              END { if (!replaced) print key "=" value }
            ' "${env_file}" >"${temporary}"
            chmod 600 "${temporary}"
            mv "${temporary}" "${env_file}"
          }
          update_env API_DOMAIN "${public_domain}"
          update_env PUBLIC_SCHEME https
          update_env ADMIN_PORTAL_URL "https://${public_domain}"
          update_env KEYCLOAK_SECURITY_MODE HTTPS_HOSTED
          update_env CORS_ALLOWED_ORIGINS "https://${public_domain}"
          remove_env() {
            local key="$1" temporary
            temporary="$(mktemp "${env_file}.XXXXXX")"
            awk -F= -v key="${key}" '$1!=key { print }' "${env_file}" >"${temporary}"
            chmod 600 "${temporary}"
            mv "${temporary}" "${env_file}"
          }
          # This legacy provisioning override must never select bootstrap HTTP in production.
          remove_env GATEWAY_CONFIG_TEMPLATE
          release_backup="$(mktemp "${release_env}.XXXXXX")"
          cp "${release_env}" "${release_backup}"
          rollback_gateway() {
            cp "${release_backup}" "${release_env}"
            "${compose[@]}" up -d --no-deps --wait --wait-timeout 60 api-gateway >/dev/null 2>&1 || true
          }
          trap 'rollback_gateway; recover_gateway' EXIT
          update_release_env() {
            local key="$1" value="$2" temporary
            temporary="$(mktemp "${release_env}.XXXXXX")"
            awk -F= -v key="${key}" -v value="${value}" '
              BEGIN { replaced=0 }
              $1==key { if (!replaced) print key "=" value; replaced=1; next }
              { print }
              END { if (!replaced) print key "=" value }
            ' "${release_env}" >"${temporary}"
            chmod 600 "${temporary}"
            mv "${temporary}" "${release_env}"
          }
          update_release_env GATEWAY_IMAGE_TAG "${image_sha}"
          if ! "${compose[@]}" pull api-gateway ||
             ! "${compose[@]}" up -d --no-deps --wait --wait-timeout 60 api-gateway ||
             ! "${compose[@]}" exec -T api-gateway nginx -t ||
             ! API_DOMAIN="${public_domain}" ./infrastructure/hetzner/smoke-test.sh --internal; then
            echo 'Hosted deployment smoke failed; collecting non-secret reachability evidence.' >&2
            curl --fail --silent --show-error --resolve "${public_domain}:443:127.0.0.1" \
              "https://${public_domain}/healthz" >/dev/null && echo 'Gateway TLS is reachable on host loopback.'
            "${compose[@]}" ps api-gateway
            "${compose[@]}" logs --tail 80 api-gateway
            ss -lnt | grep -E ':(80|443)[[:space:]]' || true
            timeout 5 openssl s_client -connect 127.0.0.1:443 -servername "${public_domain}" -brief </dev/null || true
            sudo -n /usr/local/sbin/citizenship-inspect-firewall || \
              echo 'Host firewall inspection privilege is not installed for the deployment identity.' >&2
            exit 1
          fi
          rm -f "${release_backup}"
          trap recover_gateway EXIT
          gateway_stopped=false
          REMOTE
      - name: Validate external OIDC metadata and Admin security headers
        env:
          PUBLIC_DOMAIN: ${{ inputs.public_domain }}
        run: |
          set -Eeuo pipefail
          base="https://${PUBLIC_DOMAIN}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output discovery.json \
            "${base}/auth/realms/exam-platform/.well-known/openid-configuration"
          jq -e --arg issuer "${base}/auth/realms/exam-platform" '
            .issuer==$issuer and
            (.authorization_endpoint|startswith($issuer+"/")) and
            (.token_endpoint|startswith($issuer+"/")) and
            (.jwks_uri|startswith($issuer+"/")) and
            ([.[]|strings|select(test("localhost|onrender|keycloak:|46\\.224\\.221\\.7|http:"))]|length)==0' discovery.json
          curl --fail --silent --show-error --proto '=https' "$(jq -r .jwks_uri discovery.json)" | jq -e '.keys|length>0'
          curl --fail --silent --show-error --proto '=https' --dump-header headers.txt --output index.html "${base}/"
          grep -qi '^content-security-policy:.*connect-src '\''self' headers.txt
          if grep -Eqi 'onrender|46\.224\.221\.7|http://' index.html; then
            echo 'Hosted Admin HTML leaked a stale or insecure endpoint.' >&2
            exit 1
          fi
          rm -f discovery.json headers.txt index.html
