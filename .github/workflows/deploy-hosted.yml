name: Deploy hosted environment

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full tested commit SHA whose images exist in GHCR
        required: true
      activate_source_revision:
        description: Run the separately governed Sverige i fokus source migration
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hosted
    steps:
      - name: Validate deployment input
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: '[[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]'
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTED_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTED_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" >~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${KNOWN_HOSTS}" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Install optional Groq secret in the existing hosted environment file
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HOSTED_HOST: ${{ secrets.HOSTED_HOST }}
          HOSTED_USER: ${{ secrets.HOSTED_USER }}
        run: |
          if [[ -z "${GROQ_API_KEY}" ]]; then
            echo "Groq secret was not supplied; preserving the hosted provider configuration."
            exit 0
          fi
          umask 077
          local_secret_file="$(mktemp)"
          remote_secret_file="$(ssh -o BatchMode=yes "${HOSTED_USER}@${HOSTED_HOST}" 'mktemp /tmp/groq-secret.XXXXXX')"
          cleanup() {
            rm -f "${local_secret_file}"
            ssh -o BatchMode=yes "${HOSTED_USER}@${HOSTED_HOST}" "rm -f '${remote_secret_file}'" || true
          }
          trap cleanup EXIT
          printf '%s' "${GROQ_API_KEY}" >"${local_secret_file}"
          scp -q -o BatchMode=yes "${local_secret_file}" "${HOSTED_USER}@${HOSTED_HOST}:${remote_secret_file}"
          ssh -o BatchMode=yes "${HOSTED_USER}@${HOSTED_HOST}" "bash -s '${remote_secret_file}'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          secret_file="$1"
          groq_key="$(cat "${secret_file}")"
          rm -f "${secret_file}"
          env_file=/opt/citizenship-platform/.env
          [[ -f "${env_file}" && "$(stat -c '%a' "${env_file}")" == 600 ]]
          update_env() {
            local key="$1" value="$2" temporary
            temporary="$(mktemp "${env_file}.XXXXXX")"
            awk -F= -v key="${key}" -v value="${value}" '
              BEGIN { replaced=0 }
              $1==key { if (!replaced) print key "=" value; replaced=1; next }
              { print }
              END { if (!replaced) print key "=" value }
            ' "${env_file}" >"${temporary}"
            chmod 600 "${temporary}"
            mv "${temporary}" "${env_file}"
          }
          update_env GROQ_API_KEY "${groq_key}"
          update_env GROQ_ENABLED true
          update_env GROQ_MODEL openai/gpt-oss-120b
          update_env GROQ_FREE_ONLY true
          update_env GROQ_FREE_REQUEST_LIMIT 1000
          update_env GROQ_FREE_TOKEN_LIMIT 8000
          REMOTE_SCRIPT
      - name: Enable application-capped OpenRouter paid fallback
        env:
          HOSTED_HOST: ${{ secrets.HOSTED_HOST }}
          HOSTED_USER: ${{ secrets.HOSTED_USER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -z "${OPENROUTER_API_KEY}" ]]; then
            echo "OpenRouter secret was not supplied; preserving the hosted provider configuration."
            exit 0
          fi
          read -r -d '' remote_script <<'REMOTE_SCRIPT' || true
            set -Eeuo pipefail
            IFS= read -r openrouter_key
            env_file=/opt/citizenship-platform/.env
            [[ -n "${openrouter_key}" && -f "${env_file}" && "$(stat -c "%a" "${env_file}")" == 600 ]]
            update_env() {
              local key="$1" value="$2" temporary
              temporary="$(mktemp "${env_file}.XXXXXX")"
              awk -F= -v key="${key}" -v value="${value}" '
                BEGIN { replaced=0 }
                $1==key { if (!replaced) print key "=" value; replaced=1; next }
                { print }
                END { if (!replaced) print key "=" value }
              ' "${env_file}" >"${temporary}"
              chmod 600 "${temporary}"
              mv "${temporary}" "${env_file}"
            }
            update_env OPENROUTER_API_KEY "${openrouter_key}"
            update_env OPENROUTER_ALLOW_PAID true
            update_env OPENROUTER_BUDGET_USD 14.00
            update_env AI_PROVIDER_PRIORITY GEMINI,GROQ,OPENROUTER_FREE,OPENROUTER_PAID
          REMOTE_SCRIPT
          printf '%s\n' "${OPENROUTER_API_KEY}" | ssh -o BatchMode=yes "${HOSTED_USER}@${HOSTED_HOST}" \
            "bash -c $(printf '%q' "${remote_script}")"
      - name: Provision protected identity-management BFF credentials
        env:
          HOSTED_HOST: ${{ secrets.HOSTED_HOST }}
          HOSTED_USER: ${{ secrets.HOSTED_USER }}
        run: |
          ssh -o BatchMode=yes "${HOSTED_USER}@${HOSTED_HOST}" 'bash -s' <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          env_file=/opt/citizenship-platform/.env
          [[ -f "${env_file}" && "$(stat -c '%a' "${env_file}")" == 600 ]]
          current_secret="$(awk -F= '$1=="IDENTITY_BFF_CLIENT_SECRET"{sub(/^[^=]*=/,""); print; exit}' "${env_file}")"
          if [[ -z "${current_secret}" ]]; then current_secret="$(openssl rand -hex 32)"; fi
          update_env() {
            local key="$1" value="$2" temporary
            temporary="$(mktemp "${env_file}.XXXXXX")"
            awk -F= -v key="${key}" -v value="${value}" '
              BEGIN { replaced=0 }
              $1==key { if (!replaced) print key "=" value; replaced=1; next }
              { print }
              END { if (!replaced) print key "=" value }
            ' "${env_file}" >"${temporary}"
            chmod 600 "${temporary}"
            mv "${temporary}" "${env_file}"
          }
          update_env IDENTITY_MANAGEMENT_ENABLED true
          update_env IDENTITY_BFF_CLIENT_ID identity-management-bff
          update_env IDENTITY_BFF_CLIENT_SECRET "${current_secret}"
          update_env IDENTITY_RECENT_AUTHENTICATION_SECONDS 300
          REMOTE_SCRIPT
      - name: Deploy immutable images
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          HOSTED_HOST: ${{ secrets.HOSTED_HOST }}
          HOSTED_USER: ${{ secrets.HOSTED_USER }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          ssh -o BatchMode=yes "${HOSTED_USER}@${HOSTED_HOST}" \
            "cd /opt/citizenship-platform/repo && git fetch --quiet origin '${COMMIT_SHA}' && git checkout --detach '${COMMIT_SHA}' && IMAGE_REGISTRY='${IMAGE_REGISTRY}' ./infrastructure/hetzner/deploy.sh '${COMMIT_SHA}'"
      - name: Activate corrected Sverige i fokus source revision
        if: ${{ inputs.activate_source_revision }}
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          HOSTED_HOST: ${{ secrets.HOSTED_HOST }}
          HOSTED_USER: ${{ secrets.HOSTED_USER }}
        run: |
          ssh -o BatchMode=yes "${HOSTED_USER}@${HOSTED_HOST}" \
            "cd /opt/citizenship-platform/repo && test \"\$(git rev-parse HEAD)\" = '${COMMIT_SHA}' && ./infrastructure/hetzner/migrate-sverige-i-fokus-source-v2.sh"
