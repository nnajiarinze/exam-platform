name: Build immutable authentication images

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full tested commit SHA to build
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: citizenship-api-gateway
            dockerfile: infrastructure/gateway/Dockerfile
          - image: citizenship-keycloak
            dockerfile: infrastructure/keycloak/Dockerfile
    steps:
      - name: Validate immutable input
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: '[[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.commit_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
