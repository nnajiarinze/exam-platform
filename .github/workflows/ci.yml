name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test backend and migrations
        run: ./gradlew test --no-daemon
      - name: Build backend
        run: ./gradlew build --no-daemon

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - name: Verify generated API is committed
        working-directory: .
        run: git diff --exit-code -- apps/admin/src/api/generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.test
          VITE_OIDC_AUTHORITY: https://api.example.test/auth/realms/exam-platform
          VITE_OIDC_CLIENT_ID: admin-portal
          VITE_DEV_ADMIN_AUTH_ENABLED: "false"

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_APP_ENV: REMOTE
      EXPO_PUBLIC_API_BASE_URL: https://api.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - name: Verify generated API is committed
        working-directory: .
        run: git diff --exit-code -- apps/mobile/src/api/generated
      - run: npm run typecheck
      - run: npm test
      - run: npx expo config --type public

  infrastructure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: content
            dockerfile: services/content-service/Dockerfile
            scan_severity: CRITICAL,HIGH
          - name: learning
            dockerfile: services/learning-service/Dockerfile
            scan_severity: CRITICAL,HIGH
          - name: ai
            dockerfile: services/ai-service/Dockerfile
            scan_severity: CRITICAL,HIGH
          - name: gateway
            dockerfile: infrastructure/gateway/Dockerfile
            scan_severity: CRITICAL,HIGH
          - name: keycloak
            dockerfile: infrastructure/keycloak/Dockerfile
            scan_severity: CRITICAL
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: citizenship-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: citizenship-${{ matrix.name }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: ${{ matrix.scan_severity }}
      - name: Validate hosted Compose
        run: ./infrastructure/hetzner/validate-hosted-config.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check shell syntax
        run: find infrastructure/hetzner -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Check whitespace
        run: git diff --check

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
