<html class="light" lang="sv"><head>

                    "outline-variant": "#c3c6d2",

                    "error": "#ba1a1a",
                    "on-primary-fixed": "#001b3e",

                    "on-tertiary": "#ffffff",
                    "on-primary": "#ffffff",

                    "on-secondary-fixed": "#241a00",
                    "on-surface": "#141d23",
                    "outline": "#737782",
                    "surface-container-high": "#e0e9f2",
                    "background": "#f6faff",
                    "secondary-fixed": "#ffe08b",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed-variant": "#04468c",
                    "secondary-container": "#fdd355",
                    "surface-tint": "#2c5ea5",
                    "primary-fixed": "#d6e3ff",

                    "tertiary-fixed": "#e1e3e4",

<style>
        body {
            background-color: #f6faff;
            font-family: 'Hanken Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .card-shadow {
            box-shadow: 0 4px 12px rgba(43, 93, 164, 0.04);
        }
        .card-active-shadow {
            box-shadow: 0 8px 24px rgba(43, 93, 164, 0.08);
        }
        .progress-glow {
            box-shadow: 0 0 15px rgba(253, 211, 85, 0.4);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="text-on-surface">
<!-- Top AppBar Component (Modified for Focus/Exit) -->
<nav class="flex justify-between items-center w-full px-md py-sm sticky top-0 z-50 bg-surface/90 backdrop-blur-md">
<button class="w-10 h-10 flex items-center justify-center hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary" data-icon="close">close</span>
</button>
<div class="flex flex-col items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-widest uppercase">Demokrati i Sverige</span>
</div>
<div class="flex items-center gap-xs px-3 py-1 bg-surface-container rounded-full border border-outline-variant/30">
<span class="material-symbols-outlined text-secondary text-[18px]" data-icon="schedule">schedule</span>
<span class="font-label-md text-label-md text-on-surface tabular-nums" id="timer">04:52</span>
</div>
</nav>
<!-- Main Content Area -->
<main class="max-w-[1200px] mx-auto px-md md:px-lg pb-32">
<!-- Progress Bar Section -->
<div class="mt-lg mb-2xl">
<div class="flex justify-between items-end mb-sm">
<span class="font-label-md text-label-md text-primary">Fråga 7 av 12</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">58% Klart</span>
</div>
<div class="h-3 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full w-[58%] bg-secondary-container progress-glow rounded-full transition-all duration-700 ease-out"></div>
</div>
</div>
<!-- Question Section -->
<section class="mb-2xl">
<div class="inline-block px-3 py-1 bg-primary/5 text-primary rounded-lg mb-md border border-primary/10">
<span class="font-label-sm text-label-sm">RIKSVAL</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface leading-tight max-w-3xl md:text-[40px] md:leading-[1.2]">
                Hur ofta hålls ordinarie val till riksdagen?
            </h1>
</section>
<!-- Answer Grid -->
<section class="grid grid-cols-1 gap-md max-w-2xl">
<!-- Option 1 -->
<button class="group relative flex items-center p-md text-left bg-surface-container-lowest border-2 border-transparent rounded-xl card-shadow transition-all duration-200 hover:border-primary/20 active:scale-[0.98]" onclick="selectOption(this)">
<div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-lg bg-surface-container-high font-bold text-primary group-hover:bg-primary group-hover:text-white transition-colors mr-md">
                    A
                </div>
<span class="font-body-lg text-body-lg text-on-surface">Vartannat år</span>
</button>
<!-- Option 2 (Active State) -->
<button class="group relative flex items-center p-md text-left bg-surface-container-lowest border-2 border-primary rounded-xl card-active-shadow transition-all duration-200 active:scale-[0.98]" onclick="selectOption(this)">
<div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-lg bg-primary font-bold text-white mr-md">
                    B
                </div>
<div class="flex-1">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Vart fjärde år</span>
</div>
<span class="material-symbols-outlined text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<!-- Focus Ring for active selection -->
<div class="absolute -inset-1 border border-primary/20 rounded-[18px] pointer-events-none"></div>
</button>
<!-- Option 3 -->
<button class="group relative flex items-center p-md text-left bg-surface-container-lowest border-2 border-transparent rounded-xl card-shadow transition-all duration-200 hover:border-primary/20 active:scale-[0.98]" onclick="selectOption(this)">
<div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-lg bg-surface-container-high font-bold text-primary group-hover:bg-primary group-hover:text-white transition-colors mr-md">
                    C
                </div>
<span class="font-body-lg text-body-lg text-on-surface">Vart sjätte år</span>
</button>
</section>
<!-- Educational Insight (Progressive Disclosure) -->
<div class="mt-2xl p-lg bg-primary/5 rounded-2xl border border-primary/10 max-w-2xl">
<div class="flex items-start gap-md">
<span class="material-symbols-outlined text-primary mt-1" data-icon="lightbulb">lightbulb</span>
<div>
<h3 class="font-label-md text-label-md text-primary mb-1">Studietips</h3>
<p class="font-body-md text-body-md text-on-surface-variant">
                        Kom ihåg att ordinarie val hålls den andra söndagen i september vart fjärde år. Detta gäller även för regioner och kommuner.
                    </p>
</div>
</div>
</div>
</main>
<!-- Bottom Sticky Action Bar -->
<footer class="fixed bottom-0 left-0 w-full z-50 bg-surface/80 backdrop-blur-xl px-md py-lg border-t border-surface-container-highest flex justify-center">
<div class="max-w-[1200px] w-full flex items-center justify-between gap-md">
<!-- Secondary action hidden on mobile to prioritize main CTA -->
<button class="hidden md:flex items-center gap-xs px-md py-3 text-on-surface-variant font-label-md hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="flag">flag</span>
                Rapportera fel
            </button>
<button class="w-full md:w-auto md:min-w-[200px] flex items-center justify-center gap-sm bg-primary text-white py-4 px-xl rounded-xl font-headline-md text-headline-md shadow-lg active:scale-95 transition-all duration-200 hover:bg-primary/90">
                Gå vidare
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
<!-- Decorative background elements -->
<div class="fixed top-0 right-0 -z-10 w-1/3 h-1/2 opacity-20 pointer-events-none">

</div>
<script>
        function selectOption(el) {
            // Simple visual toggle for demonstration
            const allOptions = el.parentElement.children;
            for (let opt of allOptions) {
                opt.classList.remove('border-primary', 'card-active-shadow');
                opt.classList.add('border-transparent', 'card-shadow');
                const check = opt.querySelector('[data-icon="check_circle"]');
                if (check) check.remove();
                const num = opt.querySelector('div:first-child');
                num.classList.remove('bg-primary', 'text-white');
                num.classList.add('bg-surface-container-high', 'text-primary');
                
                const focusRing = opt.querySelector('.absolute.-inset-1');
                if (focusRing) focusRing.remove();
            }

            el.classList.remove('border-transparent', 'card-shadow');
            el.classList.add('border-primary', 'card-active-shadow');
            
            const num = el.querySelector('div:first-child');
            num.classList.remove('bg-surface-container-high', 'text-primary');
            num.classList.add('bg-primary', 'text-white');

            const checkSpan = document.createElement('span');
            checkSpan.className = 'material-symbols-outlined text-primary';
            checkSpan.setAttribute('data-icon', 'check_circle');
            checkSpan.style.fontVariationSettings = "'FILL' 1";
            checkSpan.textContent = 'check_circle';
            el.appendChild(checkSpan);

            const ring = document.createElement('div');
            ring.className = 'absolute -inset-1 border border-primary/20 rounded-[18px] pointer-events-none';
            el.appendChild(ring);
        }

        // Timer countdown simulation
        let timeLeft = 292; // 4:52 in seconds
        setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timer').textContent = 
                    `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
        }, 1000);
    </script>
</body></html>
